# Mantiene activo el proyecto gratis de Supabase.
# Supabase pausa los proyectos gratis que pasan varios días sin uso;
# esta tarea le hace una consulta cada 3 días para que eso no pase.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 13 */3 * *"   # cada 3 días, 10:17 h de Argentina
  workflow_dispatch:           # botón "Run workflow" para correrla a mano

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          # Misma URL y clave pública que usa la tienda (config.js); no es secreta.
          SUPABASE_URL: https://kzzflxqonistdcpgnjkm.supabase.co
          SUPABASE_KEY: sb_publishable_-VtCfa0IoKlcB31UBqUtzQ_lOOrDTcT
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase respondió: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase no respondió bien ($status). ¿Está pausado? Entrá a supabase.com/dashboard y reanudalo."
            exit 1
          fi

      # GitHub apaga las tareas programadas si el repositorio pasa 60 días sin cambios.
      # Una vez por mes se guarda una marca de actividad para evitarlo.
      # "[skip netlify]" evita que Netlify vuelva a publicar la web por este cambio.
      - name: Marca de actividad mensual
        if: github.event_name == 'schedule'
        run: |
          day=$(date -u +%d)
          if [ "$day" -gt 3 ]; then echo "No toca este mes todavía"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          date -u +"%Y-%m-%d" > .github/ultima-actividad.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ultima-actividad.txt
          git commit -m "Marca de actividad mensual [skip netlify]" || exit 0
          git push
